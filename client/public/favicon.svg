<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Luxury Champagne Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E6C8" />
      <stop offset="50%" stop-color="#C9A85C" />
      <stop offset="100%" stop-color="#A28038" />
    </linearGradient>

    <!-- Deep Luxury Navy Gradient -->
    <linearGradient id="navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2B42" />
      <stop offset="100%" stop-color="#121D2E" />
    </linearGradient>
  </defs>

  <!-- Squircle Base with Gold Rim -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#navy)" stroke="url(#gold)" stroke-width="2" />

  <!-- Inner Pinstripe Border -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="10.5" fill="none" stroke="#C9A85C" stroke-width="0.8" stroke-opacity="0.35" />

  <!-- Dynamic Sleek Car Silhouette -->
  <!-- Aerodynamic Roofline & Windshield -->
  <path d="M12 36 L17.5 24 Q20.5 20.5 25.5 20 L38.5 20 Q44 20.5 48 25 L52.5 36 Z" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Window Pillar -->
  <line x1="32.5" y1="21" x2="32.5" y2="35" stroke="url(#gold)" stroke-width="2.2" stroke-linecap="round" />

  <!-- Streamlined Waistline & Lower Body Contour -->
  <path d="M7 36.5 C7 34.5 9 34.5 12 34.5 L14 34.5 C16 31 20 29.5 23 34.5 L39 34.5 C41.5 30 46 30 48.5 34.5 L53 34.5 C56 34.5 57.5 36 57.5 38 C57.5 41 55 42 52 42 L12 42 C8.5 42 7 40 7 36.5 Z" fill="url(#gold)" />

  <!-- Left Alloy Wheel -->
  <circle cx="21" cy="38" r="5.2" fill="#121D2E" stroke="url(#gold)" stroke-width="2.2" />
  <circle cx="21" cy="38" r="1.8" fill="#F3E6C8" />

  <!-- Right Alloy Wheel -->
  <circle cx="45" cy="38" r="5.2" fill="#121D2E" stroke="url(#gold)" stroke-width="2.2" />
  <circle cx="45" cy="38" r="1.8" fill="#F3E6C8" />

  <!-- Headlight Accent Spark -->
  <circle cx="53.5" cy="36.5" r="1.3" fill="#FFFFFF" />

  <!-- Base Ground Line -->
  <path d="M11 47 L53 47" stroke="url(#gold)" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.9" />
</svg>